<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Linkage — R01MD018031</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f5f3;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
    margin: 0;
  }
  h1 {
    font-size: 18px;
    font-weight: 500;
    color: #1a1a18;
    margin: 0 0 8px;
  }
  p.subtitle {
    font-size: 13px;
    color: #5f5e5a;
    margin: 0 0 24px;
    text-align: center;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    padding: 24px;
    max-width: 760px;
    width: 100%;
  }

  /* coral = PHI/identifiable */
  .c-coral rect { fill: #FAECE7; stroke: #993C1D; }
  .c-coral text.th { fill: #712B13; }
  .c-coral text.ts { fill: #993C1D; }
  /* amber = quasi-identifier */
  .c-amber rect { fill: #FAEEDA; stroke: #854F0B; }
  .c-amber text.th { fill: #633806; }
  .c-amber text.ts { fill: #854F0B; }
  /* purple = CCHI linkage step */
  .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
  .c-purple text.th { fill: #3C3489; }
  .c-purple text.ts { fill: #534AB7; }

  text.th { font-size: 14px; font-weight: 500; }
  text.ts { font-size: 12px; font-weight: 400; }
  text.legend-label { font-size: 12px; fill: #3d3d3a; }

  .arr { stroke: #888780; stroke-width: 1.5; fill: none; }

  .swatch-coral  { fill: #FAECE7; stroke: #993C1D; }
  .swatch-amber  { fill: #FAEEDA; stroke: #854F0B; }
  .swatch-purple { fill: #EEEDFE; stroke: #534AB7; }

  @media (prefers-color-scheme: dark) {
    body { background: #1e1e1c; }
    h1 { color: #e8e6dc; }
    p.subtitle { color: #9c9a92; }
    .card { background: #2c2c2a; box-shadow: 0 1px 4px rgba(0,0,0,0.4); }
    .c-coral rect { fill: #4A1B0C; stroke: #F0997B; }
    .c-coral text.th { fill: #F5C4B3; }
    .c-coral text.ts { fill: #F0997B; }
    .c-amber rect { fill: #412402; stroke: #EF9F27; }
    .c-amber text.th { fill: #FAC775; }
    .c-amber text.ts { fill: #EF9F27; }
    .c-purple rect { fill: #26215C; stroke: #AFA9EC; }
    .c-purple text.th { fill: #CECBF6; }
    .c-purple text.ts { fill: #AFA9EC; }
    text.legend-label { fill: #c2c0b6; }
    .arr { stroke: #888780; }
    .swatch-coral  { fill: #4A1B0C; stroke: #F0997B; }
    .swatch-amber  { fill: #412402; stroke: #EF9F27; }
    .swatch-purple { fill: #26215C; stroke: #AFA9EC; }
  }
</style>
</head>
<body>
<h1>Data Linkage — PHI Annotations</h1>
<p class="subtitle">NC DETECT · State ED · State Inpatient<br>
Patel R01 — Regional Stroke Systems in NC</p>

<div class="card">
<svg width="100%" viewBox="0 0 680 820" role="img">
<title>Data linkage steps with PHI annotations</title>
<desc>Flowchart showing NC DETECT and state hospital discharge data linked across two steps by CCHI staff.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- ══ SECTION LABEL ══ -->
<text class="th" x="40" y="24" style="font-size:14px;fill:#3d3d3a;">Data sources</text>

<!-- ── SOURCE 1: NC DETECT ── -->
<g class="c-coral">
  <rect x="40" y="34" width="182" height="148" rx="8" stroke-width="0.5"/>
  <text class="th" x="131" y="56" text-anchor="middle" dominant-baseline="central">NC DETECT ED</text>
  <text class="ts" x="131" y="76" text-anchor="middle" dominant-baseline="central">Facility name</text>
  <text class="ts" x="131" y="93" text-anchor="middle" dominant-baseline="central">ED arrival date-time</text>
  <text class="ts" x="131" y="110" text-anchor="middle" dominant-baseline="central">Age (years), sex, race</text>
  <text class="ts" x="131" y="127" text-anchor="middle" dominant-baseline="central">Arrival mode ✓</text>
  <text class="ts" x="131" y="144" text-anchor="middle" dominant-baseline="central">ED disposition ✓</text>
</g>

<!-- ── SOURCE 2: State ED ── -->
<g class="c-amber">
  <rect x="249" y="34" width="182" height="148" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="54" text-anchor="middle" dominant-baseline="central">NC Hospital Discharge</text>
  <text class="th" x="340" y="72" text-anchor="middle" dominant-baseline="central">State ED data</text>
  <text class="ts" x="340" y="95" text-anchor="middle" dominant-baseline="central">Facility name</text>
  <text class="ts" x="340" y="112" text-anchor="middle" dominant-baseline="central">Encounter date</text>
  <text class="ts" x="340" y="129" text-anchor="middle" dominant-baseline="central">Age (years), sex, race</text>
  <text class="ts" x="340" y="146" text-anchor="middle" dominant-baseline="central">ICD-10, CPT-4 codes</text>
</g>

<!-- ── SOURCE 3: State Inpatient ── -->
<g class="c-amber">
  <rect x="458" y="34" width="182" height="148" rx="8" stroke-width="0.5"/>
  <text class="th" x="549" y="54" text-anchor="middle" dominant-baseline="central">NC Hospital Discharge</text>
  <text class="th" x="549" y="72" text-anchor="middle" dominant-baseline="central">State Inpatient data</text>
  <text class="ts" x="549" y="95" text-anchor="middle" dominant-baseline="central">Facility name</text>
  <text class="ts" x="549" y="112" text-anchor="middle" dominant-baseline="central">Encounter date</text>
  <text class="ts" x="549" y="129" text-anchor="middle" dominant-baseline="central">Age (years), sex, race</text>
  <text class="ts" x="549" y="146" text-anchor="middle" dominant-baseline="central">ICD-10, CPT-4, DRG, LOS</text>
</g>

<!-- ══ STEP 1 arrows: NC DETECT and State ED → Step 1 box ══ -->
<line x1="131" y1="182" x2="131" y2="222" stroke="#888780" stroke-width="1.5" fill="none"/>
<line x1="131" y1="222" x2="295" y2="222" stroke="#888780" stroke-width="1.5" fill="none"/>
<line x1="295" y1="222" x2="295" y2="242" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<line x1="340" y1="182" x2="340" y2="222" stroke="#888780" stroke-width="1.5" fill="none"/>
<line x1="340" y1="222" x2="390" y2="222" stroke="#888780" stroke-width="1.5" fill="none"/>
<line x1="390" y1="222" x2="390" y2="242" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

<!-- ══ STEP 1 box ══ -->
<g class="c-purple">
  <rect x="190" y="242" width="400" height="90" rx="8" stroke-width="0.5"/>
  <text class="th" x="390" y="266" text-anchor="middle" dominant-baseline="central">Step 1 — CCHI linkage</text>
  <text class="ts" x="390" y="286" text-anchor="middle" dominant-baseline="central">NC DETECT × State ED</text>
  <text class="ts" x="390" y="304" text-anchor="middle" dominant-baseline="central">Match on: facility name, arrival date, age, sex, race</text>
  <text class="ts" x="390" y="322" text-anchor="middle" dominant-baseline="central">Filter to EMS arrivals only · retain NC DETECT disposition</text>
</g>

<!-- Step 1 output arrow -->
<line x1="390" y1="332" x2="390" y2="372" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

<!-- ══ Step 1 output: Supplemented ED ══ -->
<g class="c-amber">
  <rect x="190" y="372" width="400" height="100" rx="8" stroke-width="0.5"/>
  <text class="th" x="390" y="396" text-anchor="middle" dominant-baseline="central">Supplemented State ED data</text>
  <text class="ts" x="390" y="416" text-anchor="middle" dominant-baseline="central">Full state ED variables</text>
  <text class="ts" x="390" y="434" text-anchor="middle" dominant-baseline="central">+ EMS arrivals only (filtered)</text>
  <text class="ts" x="390" y="452" text-anchor="middle" dominant-baseline="central">+ NC DETECT ED disposition</text>
</g>

<!-- ══ STEP 2 arrows: Supplemented ED and State Inpatient → Step 2 box ══ -->
<line x1="390" y1="472" x2="390" y2="512" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<line x1="549" y1="182" x2="549" y2="512" stroke="#888780" stroke-width="1.5" fill="none"/>
<line x1="549" y1="512" x2="496" y2="512" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

<!-- ══ STEP 2 box ══ -->
<g class="c-purple">
  <rect x="190" y="512" width="400" height="100" rx="8" stroke-width="0.5"/>
  <text class="th" x="390" y="536" text-anchor="middle" dominant-baseline="central">Step 2 — CCHI linkage</text>
  <text class="ts" x="390" y="556" text-anchor="middle" dominant-baseline="central">Supplemented State ED × State Inpatient</text>
  <text class="ts" x="390" y="574" text-anchor="middle" dominant-baseline="central">Filter: NC DETECT disposition = admitted (same hospital)</text>
  <text class="ts" x="390" y="592" text-anchor="middle" dominant-baseline="central">Match on: facility name, encounter date, age, sex</text>
</g>

<!-- Step 2 output arrow -->
<line x1="390" y1="612" x2="390" y2="652" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

<!-- ══ Step 2 output: Linked ED + Inpatient ══ -->
<g class="c-amber">
  <rect x="190" y="652" width="400" height="120" rx="8" stroke-width="0.5"/>
  <text class="th" x="390" y="678" text-anchor="middle" dominant-baseline="central">Linked ED + Inpatient dataset</text>
  <text class="ts" x="390" y="700" text-anchor="middle" dominant-baseline="central">State ED variables + NC DETECT disposition</text>
  <text class="ts" x="390" y="718" text-anchor="middle" dominant-baseline="central">+ State inpatient variables</text>
  <text class="ts" x="390" y="736" text-anchor="middle" dominant-baseline="central">PHI present: facility name, encounter date,</text>
  <text class="ts" x="390" y="754" text-anchor="middle" dominant-baseline="central">age, sex, race</text>
</g>

</svg>
</div>
